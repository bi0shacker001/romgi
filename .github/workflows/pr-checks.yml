name: PR checks

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests (db/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: db/requirements.txt

      - name: Install runtime + test deps
        run: pip install -r db/requirements.txt pytest

      - name: Build MiNERVA test fixture
        working-directory: db
        run: python tests/fixtures/build_minerva_fixture.py

      - name: Run pytest
        working-directory: db
        run: python -m pytest tests -v

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    name: Flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Branch name for artifact naming and (via GITHUB_HEAD_REF/GITHUB_REF_NAME,
      # read directly by android/app/build.gradle.kts) the app's package id/label.
      - name: Compute branch slug
        id: meta
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          echo "safe_branch=${branch//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: romgi-${{ steps.meta.outputs.safe_branch }}-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: romgi-${{ steps.meta.outputs.safe_branch }}-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # One rolling pre-release per branch (tag build-<branch>), so there's
      # a stable, easy-to-find download link instead of digging through
      # Actions run history — each push replaces this branch's release
      # in place rather than accumulating new ones. Skipped on pull_request
      # runs (e.g. from forks) since those shouldn't publish anything.
      - name: Rename APKs for release
        if: github.event_name == 'push'
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "romgi-${{ steps.meta.outputs.safe_branch }}-debug.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "romgi-${{ steps.meta.outputs.safe_branch }}-release.apk"

      - name: Publish branch release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.meta.outputs.safe_branch }}
          name: romgi (${{ steps.meta.outputs.safe_branch }}) — latest build
          prerelease: true
          body: |
            Automated build from ${{ github.sha }}. Replaced on every push to
            `${{ steps.meta.outputs.safe_branch }}` — not a stable release.
          files: |
            romgi-${{ steps.meta.outputs.safe_branch }}-debug.apk
            romgi-${{ steps.meta.outputs.safe_branch }}-release.apk
