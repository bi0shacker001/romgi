name: One-off debug keystore generator

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate fixed debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=romgi-bio debug,O=romgi-bio,C=US"

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
